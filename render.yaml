services:
  - type: worker
    name: ai-course-generator-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: corepack pnpm worker:heavy-generation
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_HEAVY_API_KEYS
        sync: false
      - key: GROQ_LIGHT_API_KEYS
        sync: false
      - key: GROQ_PAID_API_KEY
        sync: false